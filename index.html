<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UK WATCH Dashboard</title>

  <!-- PWA Standalone Manifest Settings -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./UK Logo.png">
  <meta name="theme-color" content="#000000">
  
  <!-- Mobile App Mode Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UK Watch">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --neon-lime: #c1ff72;
    }
    body { 
      background-color: #050505; 
      color: #f3f4f6; 
      font-family: 'Inter', sans-serif; 
      user-select: none; 
    }
    .text-lime-neon { color: #c1ff72; }
    .bg-lime-neon { background-color: #c1ff72; }
    .border-lime-neon { border-color: #c1ff72; }
    
    .card-dark { 
      background: #0d0d0d; 
      border: 1px solid #1f2937; 
      border-radius: 2rem; 
      transition: all 0.3s ease; 
    }
    
    .pulse-active { animation: pulse-lime 2s infinite; }
    @keyframes pulse-lime {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(193, 255, 114, 0.4); }
      70% { transform: scale(1.02); box-shadow: 0 0 0 12px rgba(193, 255, 114, 0); }
      100% { transform: scale(1); }
    }
    
    .pulse-danger { animation: pulse-red 1.5s infinite; border: 1px solid #ef4444 !important; }
    @keyframes pulse-red {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
      100% { transform: scale(1); }
    }

    .paid-row { 
      opacity: 0.5; 
      filter: grayscale(0.8); 
      background: #111111 !important; 
      border-left: 4px solid #c1ff72 !important; 
    }
    .paid-badge { 
      background: #c1ff72; 
      color: #000000; 
      padding: 2px 8px; 
      border-radius: 12px; 
      font-size: 10px; 
      font-weight: 900; 
      text-transform: uppercase; 
      margin-left: 8px; 
    }

    input, select {
      color-scheme: dark;
    }
  </style>
</head>
<body class="p-4 md:p-8">

  <!-- Login Screen -->
  <div id="loginPage" class="fixed inset-0 bg-black z-[100] flex items-center justify-center p-6 text-center">
    <div class="bg-[#0f0f0f] border border-[#222222] w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl flex flex-col items-center">
      <img src="UK Logo.png" alt="UK Watch Logo" class="h-24 w-auto mb-6 object-contain" onerror="this.src='https://via.placeholder.com/150/000000/c1ff72?text=UK+LOGO'">
      <div class="space-y-4 w-full">
        <input type="text" id="uName" placeholder="Username" class="w-full p-4 bg-[#181818] border border-[#2e2e2e] rounded-2xl outline-none font-bold text-center text-white focus:border-[#c1ff72] transition">
        <input type="password" id="uPass" placeholder="Password" class="w-full p-4 bg-[#181818] border border-[#2e2e2e] rounded-2xl outline-none font-bold text-center text-white focus:border-[#c1ff72] transition">
        <button onclick="attemptLogin()" class="w-full bg-lime-neon text-black font-black py-5 rounded-2xl shadow-lg uppercase text-xs hover:opacity-90 transition tracking-wider">Unlock Dashboard</button>
      </div>
    </div>
  </div>

  <!-- Sync Loader -->
  <div id="loader" class="fixed inset-0 bg-black/90 backdrop-blur-md z-[110] flex flex-col items-center justify-center hidden">
    <div class="h-12 w-12 border-4 border-lime-neon border-t-transparent rounded-full animate-spin mb-4"></div>
    <p class="font-black text-lime-neon text-xs tracking-widest uppercase">Syncing Live Data</p>
  </div>

  <!-- Main Dashboard -->
  <div id="mainDashboard" class="max-w-6xl mx-auto space-y-6 hidden">
    
    <!-- Top Bar Header -->
    <div class="flex justify-between items-center bg-[#0d0d0d] p-5 md:p-6 rounded-[2.5rem] border border-[#1f2937]">
      <div class="flex items-center gap-3">
        <img src="UK Logo.png" alt="UK Watch Logo" class="h-12 w-auto object-contain" onerror="this.src='https://via.placeholder.com/100/000000/c1ff72?text=UK+LOGO'">
      </div>
      <div class="flex items-center gap-2 md:gap-3">
        <select id="monthFilter" onchange="updateUI()" class="p-3 border border-[#2e2e2e] rounded-2xl font-bold bg-[#181818] text-white text-xs md:text-sm outline-none cursor-pointer min-w-[130px] md:min-w-[180px] focus:border-[#c1ff72]">
          <option value="Current Month">Current Month</option>
        </select>
        <button onclick="fetchData()" title="Refresh Data" class="p-3 md:p-4 bg-[#181818] text-lime-neon border border-[#2e2e2e] rounded-2xl hover:border-[#c1ff72] transition">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </button>
        <button onclick="logout()" title="Logout" class="p-3 md:p-4 bg-rose-950/40 text-rose-400 border border-rose-900/50 rounded-2xl hover:bg-rose-900 hover:text-white transition flex items-center gap-1 font-bold text-xs">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
          <span class="hidden md:inline">Logout</span>
        </button>
      </div>
    </div>

    <!-- Cards Summary -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div id="walletCard" class="card-dark p-7">
        <p class="text-[10px] font-black text-slate-500 uppercase tracking-tighter">Remaining Budget</p>
        <h2 id="walletVal" class="text-5xl font-black mt-1 text-lime-neon">Rs. 0</h2>
      </div>
      <div class="card-dark p-7 bg-[#141414] border-lime-neon/30">
        <p class="text-[10px] font-black text-slate-400 uppercase tracking-tighter">Total Amount (Salary)</p>
        <h2 id="salaryVal" class="text-5xl font-black mt-1 text-white">Rs. 0</h2>
      </div>
      <div id="debtCard" class="card-dark p-7">
        <p class="text-[10px] font-black text-slate-500 uppercase tracking-tighter">Debt Total</p>
        <h2 id="debtVal" class="text-5xl font-black mt-1 text-rose-500">Rs. 0</h2>
      </div>
    </div>

    <!-- Entry Form & Table -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <!-- Input Form -->
      <div class="lg:col-span-4 bg-[#0d0d0d] p-8 rounded-[2.5rem] border border-[#1f2937]">
        <form onsubmit="saveData(event)" id="entryForm" class="space-y-4">
          <input type="date" id="date" required class="w-full p-4 bg-[#181818] border border-[#2e2e2e] rounded-2xl font-bold text-white outline-none focus:border-[#c1ff72]">
          
          <select id="cat" class="w-full p-4 bg-[#181818] border border-[#2e2e2e] rounded-2xl font-bold text-white outline-none focus:border-[#c1ff72]">
            <option>House Spend</option><option>Bike Fuel</option><option>Medical</option>
            <option>Fast Food</option><option>Clothes</option><option>Home Decor</option>
            <option>Fruits</option><option>Bike Maintanence</option><option>Shoes</option>
            <option>Debt</option><option>Vegetable</option><option>Committee</option>
            <option>Grocery</option><option>Gift / Eidi/ Marriage Salami</option><option>Others</option>
          </select>
          
          <input type="number" id="amt" placeholder="Amount" required class="w-full p-6 bg-[#181818] border-2 border-lime-neon/40 rounded-2xl text-3xl font-black text-lime-neon outline-none focus:border-[#c1ff72]">
          
          <input type="text" id="desc" placeholder="Details..." class="w-full p-4 bg-[#181818] border border-[#2e2e2e] rounded-2xl text-white outline-none focus:border-[#c1ff72]">
          
          <select id="user" class="w-full p-4 bg-[#181818] border border-[#2e2e2e] text-white rounded-2xl font-bold outline-none focus:border-[#c1ff72]">
            <option>Usman</option><option>UK</option>
          </select>
          
          <button type="submit" class="w-full bg-lime-neon text-black font-black py-5 rounded-2xl shadow-xl uppercase text-xs hover:opacity-90 transition tracking-wider">Submit Entry</button>
        </form>
      </div>

      <!-- Data Table -->
      <div class="lg:col-span-8 bg-[#0d0d0d] rounded-[2.5rem] border border-[#1f2937] overflow-hidden">
        <div class="overflow-x-auto max-h-[600px]">
          <table class="w-full text-left">
            <thead class="bg-[#141414] text-[10px] font-black uppercase text-slate-500 sticky top-0 border-b border-[#1f2937]">
              <tr><th class="p-6">Details</th><th class="p-6 text-right">Value</th><th class="p-6 text-center">Status</th></tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-[#1a1a1a]"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbybMaPzPFYWj8Y5lLknZWNCHp79WNz5mBVc8YV2rpOdXLz9w32CGSnGKsNYdmLJ1dII/exec"; 

    let rawData = [], monthlyStats = {};
    let activeUser = "";

    function showLoader(v) { document.getElementById('loader').classList.toggle('hidden', !v); }

    function jsonpFetch(url, callbackName) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        const sep = url.includes('?') ? '&' : '?';
        script.src = `${url}${sep}callback=${callbackName}`;
        
        window[callbackName] = (data) => {
          resolve(data);
          document.body.removeChild(script);
          delete window[callbackName];
        };
        
        script.onerror = () => {
          reject(new Error("JSONP Request Failed"));
          document.body.removeChild(script);
        };
        document.body.appendChild(script);
      });
    }

    function attemptLogin() {
      const user = document.getElementById('uName').value;
      const pass = document.getElementById('uPass').value;
      showLoader(true);

      const loginUrl = `${API_URL}?action=checkLogin&user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}`;
      
      jsonpFetch(loginUrl, 'handleLoginResponse')
        .then(res => {
          showLoader(false);
          if (res.success) {
            activeUser = user;
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('mainDashboard').classList.remove('hidden');
            document.getElementById('user').value = (user === "UKlove") ? "UK" : "Usman";
            fetchData();
          } else {
            alert(res.message);
          }
        })
        .catch(err => { 
          showLoader(false); 
          alert("Login error! Please refresh and try again."); 
        });
    }

    function logout() {
      activeUser = "";
      document.getElementById('uName').value = "";
      document.getElementById('uPass').value = "";
      document.getElementById('mainDashboard').classList.add('hidden');
      document.getElementById('loginPage').style.display = 'flex';
    }

    function fetchData() {
      showLoader(true);
      const dataUrl = `${API_URL}?action=getFullData`;

      jsonpFetch(dataUrl, 'handleDataResponse')
        .then(res => {
          rawData = res.allData || [];
          monthlyStats = res.monthlyStats || {};
          
          const monthSelect = document.getElementById('monthFilter');
          const currentVal = monthSelect.value;
          monthSelect.innerHTML = '<option value="Current Month">Current Month</option>';
          
          const sortedMonths = Object.keys(monthlyStats)
            .filter(m => m !== "Current Month")
            .sort((a, b) => new Date(b) - new Date(a));

          sortedMonths.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m;
            opt.innerText = m;
            monthSelect.appendChild(opt);
          });
          
          monthSelect.value = (currentVal && monthlyStats[currentVal]) ? currentVal : "Current Month";
          updateUI();
          showLoader(false);
        })
        .catch(err => { 
          showLoader(false); 
          alert("Data Fetching Error!");
        });
    }

    function updateUI() {
      const selectedTab = document.getElementById('monthFilter').value;
      const stats = monthlyStats[selectedTab] || { salary: 0, total: 0, debt: 0 };
      const isPastMonth = selectedTab !== "Current Month";

      const budget = isPastMonth ? 0 : (stats.salary - stats.total);
      const walletCard = document.getElementById('walletCard');
      const debtCard = document.getElementById('debtCard');

      walletCard.classList.remove('pulse-active');
      debtCard.classList.remove('pulse-danger');

      if (isPastMonth && stats.debt > 0) {
        debtCard.classList.add('pulse-danger');
      } else if (!isPastMonth) {
        if (budget < 0) debtCard.classList.add('pulse-danger');
        else walletCard.classList.add('pulse-active');
      }
      
      let filtered = rawData.filter(i => i.sheetName === selectedTab);
      filtered.sort((a, b) => (a.cat.toLowerCase() === 'debt' ? -1 : 1));
      
      let html = '';
      filtered.forEach((i) => {
        const isDebt = i.cat.toLowerCase() === 'debt';
        const rowClass = isDebt ? 'paid-row' : '';
        const badgeHtml = isDebt ? '<span class="paid-badge">Settled ✓</span>' : '';

        html += `<tr class="${rowClass} transition-all">
          <td class="p-6">
            <div class="flex items-center gap-2">
              <span class="text-[9px] font-black px-2 py-0.5 rounded-md ${i.by === 'UK' ? 'bg-orange-500/20 text-orange-400 border border-orange-500/30' : 'bg-lime-neon/20 text-lime-neon border border-lime-neon/30'} uppercase">${i.by}</span>
              ${badgeHtml}
            </div>
            <p class="font-black text-slate-100 text-base mt-1">${i.cat}</p>
            <p class="text-[11px] text-slate-400 italic">${i.desc || '...'}</p>
          </td>
          <td class="p-6 text-right">
            <span class="text-xl font-black ${isDebt ? 'text-lime-neon' : 'text-white'}">Rs. ${i.amt.toLocaleString()}</span>
          </td>
          <td class="p-6 text-center">
             <div class="text-[10px] font-black uppercase text-slate-500">${isDebt ? 'Settled' : 'Active'}</div>
          </td>
        </tr>`;
      });

      document.getElementById('tableBody').innerHTML = html || '<tr><td colspan="3" class="p-10 text-center text-slate-500 font-bold uppercase text-xs tracking-widest">No Records Found</td></tr>';
      document.getElementById('salaryVal').innerText = "Rs. " + stats.salary.toLocaleString();
      document.getElementById('walletVal').innerText = "Rs. " + budget.toLocaleString();
      document.getElementById('debtVal').innerText = "Rs. " + stats.debt.toLocaleString();
    }

    function saveData(e) {
      e.preventDefault();
      showLoader(true);

      const payload = {
        date: document.getElementById('date').value,
        category: document.getElementById('cat').value,
        description: document.getElementById('desc').value,
        amount: document.getElementById('amt').value,
        addedBy: document.getElementById('user').value
      };

      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        if(res.success) {
          document.getElementById('entryForm').reset();
          document.getElementById('date').valueAsDate = new Date();
          fetchData();
        } else {
          showLoader(false);
          alert("Error saving data");
        }
      })
      .catch(err => { 
        showLoader(false); 
        alert("Error connecting to server while saving!"); 
      });
    }

    window.onload = () => { document.getElementById('date').valueAsDate = new Date(); };

    // Register Service Worker with Strict Scope
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then(reg => console.log('SW Registered!', reg))
          .catch(err => console.log('SW Error:', err));
      });
    }
  </script>
</body>
</html>
